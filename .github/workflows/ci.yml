name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Helper-backed suites skip here on purpose: CI builds no worktree-hygiene
      # helper, so PI_SUBAGENTS_TASK_HELPER stays unset (README, "Testing with the task helper").
      - run: npm run test
      - uses: oven-sh/setup-bun@v2
      - run: npm run bundle

  compat-floor-pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install floor Pi 0.85.1 for awaited compaction
        run: npm install --no-save @earendil-works/pi-coding-agent@0.85.1 @earendil-works/pi-ai@0.85.1 @earendil-works/pi-tui@0.85.1
      - name: Typecheck against floor Pi
        run: npm run typecheck
      - name: Test suite against floor Pi
        run: npx vitest run --reporter=dot

  compat-latest-pi:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install latest Pi canary beyond the 0.85.1 compile baseline
        run: npm install --no-save @earendil-works/pi-coding-agent@latest @earendil-works/pi-ai@latest @earendil-works/pi-tui@latest
      - name: Typecheck against current Pi
        run: npm run typecheck
      - name: Test suite against current Pi
        run: npx vitest run --reporter=dot
